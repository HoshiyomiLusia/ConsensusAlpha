services:
  test-api:
    build: .
    env_file:
      - .env.test
    ports:
      - "8001:8000"
    depends_on:
      test-postgres:
        condition: service_healthy

  test-frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && VITE_API_BASE_URL=http://127.0.0.1:8001 pnpm dev --host 0.0.0.0 --port 5174"
    ports:
      - "5174:5174"
    volumes:
      - ./frontend:/app
    depends_on:
      - test-api

  test-postgres:
    image: postgres:16-alpine
    env_file:
      - .env.test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - test_postgres_data:/var/lib/postgresql/data

volumes:
  test_postgres_data:
