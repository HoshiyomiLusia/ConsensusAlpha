services:
  test-api:
    build:
      context: https://github.com/HoshiyomiLusia/ConsensusAlpha.git#main
    env_file:
      - .env.test
    ports:
      - "8001:8000"
    depends_on:
      test-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - api

  test-frontend:
    build:
      context: https://github.com/HoshiyomiLusia/ConsensusAlpha.git#main:frontend
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "5174:80"
    depends_on:
      test-api:
        condition: service_healthy

  test-postgres:
    image: postgres:16-alpine
    env_file:
      - .env.test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - test_postgres_data:/var/lib/postgresql/data

volumes:
  test_postgres_data:
