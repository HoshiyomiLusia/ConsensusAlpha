[project]
name = "consensus-alpha"
version = "0.1.0"
description = "AI-assisted equity research, consensus risk gates, and protected Webull execution."
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
  "sqlalchemy>=2.0",
  "tenacity>=8.3",
  "uvicorn[standard]>=0.30",
  "webull-openapi-python-sdk>=2.0.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
