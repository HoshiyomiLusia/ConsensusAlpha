services:
  api:
    build:
      context: https://github.com/HoshiyomiLusia/ConsensusAlpha.git#main
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://consensus:consensus@postgres:5432/consensus_alpha
      BROKER_PROVIDER: mock
      TRADING_MODE: paper
      ENABLE_LIVE_TRADING: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: https://github.com/HoshiyomiLusia/ConsensusAlpha.git#main:frontend
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8000
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: consensus_alpha
      POSTGRES_USER: consensus
      POSTGRES_PASSWORD: consensus
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
