services:
  api:
    build:
      context: https://github.com/HoshiyomiLusia/ConsensusAlpha.git#main
    volumes:
      - ./.env.work:/app/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - api

  frontend:
    build:
      context: https://github.com/HoshiyomiLusia/ConsensusAlpha.git#main:frontend
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env.work
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - work_postgres_data:/var/lib/postgresql/data

volumes:
  work_postgres_data:
